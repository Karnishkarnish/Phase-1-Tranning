<h2> Now Showing</h2>
<div class="movie-grid">
  <div class="movie-card" *ngFor="let movie of movies">
    <img [src]="movie.poster" alt="{{movie.title}}">
    <h3>{{movie.title}}</h3>
    <p>Directed by {{movie.director}}</p>
    <p>Year: {{movie.year}}</p>
    <button [routerLink]="['/movie', movie.id]">Book Tickets</button>
  </div>
</div>
